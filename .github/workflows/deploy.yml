# Deploy — build the Next.js static export and publish to GitHub Pages.
#
# Owned by Rory (DevOps). DORMANT until Sky pushes the repo to GitHub and
# completes the one-time manual setup (see docs/DEPLOY_PLAN.md §3).
#
# Separation of concerns:
#   - ci.yml (Gary) gates every PR with lint + typecheck + test + build.
#   - deploy.yml (this file) ONLY builds + ships what Sky has already merged.
#     No lint, no test, no typecheck here — that's ci.yml's job.
#
# Triggers (CI-GATED since 2026-08-23, Sky's ruling — CI-DEPLOY-UNGATED is resolved):
#   - workflow_run on "CI": fires only after ci.yml completes on main, and the
#     build job runs only when CI concluded success. A red CI = no deploy; the
#     old version stays up. This closes the gap where a push could deploy a
#     build that CI later failed.
#   - workflow_dispatch: manual re-deploy button in the Actions tab (e.g. for
#     §6.2 emergency rollback by re-running the last good run). The manual
#     path is deliberately ungated — it exists for emergencies.
#
# Permissions (top-level, GH-Pages requirements):
#   - contents: read   — checkout the code.
#   - pages: write     — publish to GH-Pages.
#   - id-token: write  — OIDC token for deploy-pages@v5.
#
# Concurrency:
#   - Group "pages" so only one deploy runs at a time.
#   - cancel-in-progress: if Sky pushes twice quickly, the older run is
#     cancelled and the newest commit wins. Keeps the live site predictable.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # The gate: deploy only what CI has proven. Manual dispatch stays open as
    # the emergency path (it deploys the current main tip, ungated on purpose).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # workflow_run events carry the SHA that CI actually verified — deploy
          # exactly that. Falls back to the default-branch tip for dispatch.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # `next build` with `output: 'export'` in next.config.mjs emits ./out.
        # (There is no basePath — next.config.mjs sets none — so the site serves
        # at the domain root.) The archive route (/archive) inlines its Supabase
        # URL + publishable anon key from repo Actions *Variables* (RLS is the
        # security boundary; the anon key is public by design). If they are unset
        # the archive still builds, it just can't reach its project.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        # v4+ excludes dotfiles by default. Intentional here: it drops
        # out/.nojekyll (a no-op for workflow-based Pages deploys — Jekyll
        # only runs for deploy-from-branch) and stray .DS_Store files that
        # should never ship. Pass include-hidden-files only if a dotfile
        # ever genuinely needs to be served.
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
