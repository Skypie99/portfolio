# Supabase keepalive — the archive's project must never free-tier auto-pause.
#
# The Studio Archive (/archive) exists so Sky can open the catalogue from ANY
# device — the "dead phone in an art store, borrowed computer" test. A free-tier
# Supabase project pauses after ~7 idle days, and a paused project can't be woken
# from a borrowed machine. This job makes one tiny anon REST read a day so the
# project always counts as active.
#
# It leaks nothing: the request uses the publishable anon key, and there is NO
# anon RLS policy, so the read returns an empty array. It just registers activity.
#
# Caveat (documented in docs/ARCHIVE_RUNBOOK.md): GitHub disables scheduled
# workflows after ~60 days with no repo activity. Any push resets that clock, and
# the Actions tab has a one-click "Enable workflow" button if it ever sleeps.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 * * *' # daily ~06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping the archive project
    runs-on: ubuntu-latest
    steps:
      - name: Anon REST read (keeps the project active)
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase Actions variables not set yet — nothing to ping. Skipping."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/supplies?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "REST keepalive returned HTTP $code (200 = empty array via RLS = success)"
          case "$code" in
            2*) exit 0 ;;
            *) echo "unexpected status — the project may be paused or misconfigured"; exit 1 ;;
          esac
