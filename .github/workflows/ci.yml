# CI — lint, typecheck, test, build
#
# Owned by Gary (QA). Dormant until Sky pushes to GitHub.
# Rory owns deploy.yml in a later cycle — DO NOT add a deploy job here.
#
# Triggers:
#   - pull_request -> main: gate every PR before merge.
#   - push -> cycle/*: catch regressions during in-flight cycle work.
#
# Concurrency:
#   - Group by ref so an in-flight run is cancelled when a new commit lands.
#   - PRs and branch pushes don't fight each other (the workflow_ref includes
#     the event type).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "cycle/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
