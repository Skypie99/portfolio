# CI — lint, typecheck, test, build
#
# Owned by Gary (QA). This is the release gate: deploy.yml publishes a commit
# only after this workflow succeeds for it on main (the one exception is the
# deliberately ungated manual workflow_dispatch in deploy.yml). Keep deploy
# steps out of this file; deploy.yml owns publishing.
#
# Triggers:
#   - pull_request -> main: check a PR before it merges.
#   - push -> main: the run that gates production. When it completes,
#     deploy.yml (workflow_run) deploys the exact commit it verified, and only
#     if it concluded success; a red run leaves the current site up. Gated
#     since 2026-08-23 (Sky's ruling, recorded in deploy.yml).
#   - push -> cycle/**: catch regressions during in-flight cycle work.
#
# Concurrency:
#   - Group by workflow + ref so an in-flight run is cancelled when a new
#     commit lands on the same ref.
#   - PR runs (refs/pull/<n>/merge) and branch pushes (refs/heads/<branch>)
#     have different refs, so they never cancel each other.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "cycle/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Build FIRST. The build-dependent guards (static-integrity.test.ts and
      # section-nav-anchors.test.ts) read ./out/ and deliberately SKIP when it is
      # absent, so running `npm run test` on a bare checkout executed neither —
      # every link-resolution, share-card, reveal-floor, new-tab and image-asset
      # check silently sat out CI and only ever ran on someone's laptop. The skip
      # was labeled, not silent, but nothing failed when it fired.
      - run: npm run build
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
