# CI — lint, typecheck, test, build
#
# Owned by Gary (QA). Dormant until Sky pushes to GitHub.
# Rory owns deploy.yml in a later cycle — DO NOT add a deploy job here.
#
# Triggers:
#   - pull_request -> main: gate every PR before merge.
#   - push -> main: the workflow actually in use. This repo is merged locally
#     and pushed straight to main, so the PR trigger never fires and only one
#     stale branch has ever matched cycle/** — CI was, in practice, dormant
#     while deploy.yml shipped every push to production. This does NOT gate the
#     deploy (deploy.yml runs independently on the same push); it means a broken
#     main is REPORTED rather than unnoticed. Making the deploy depend on CI is a
#     policy change that can block a push, so it is Sky's call, not this fix's —
#     see DECISIONS §P `CI-DEPLOY-UNGATED`.
#   - push -> cycle/*: catch regressions during in-flight cycle work.
#
# Concurrency:
#   - Group by ref so an in-flight run is cancelled when a new commit lands.
#   - PRs and branch pushes don't fight each other (the workflow_ref includes
#     the event type).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "cycle/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Build FIRST. The build-dependent guards (static-integrity.test.ts and
      # section-nav-anchors.test.ts) read ./out/ and deliberately SKIP when it is
      # absent, so running `npm run test` on a bare checkout executed neither —
      # every link-resolution, share-card, reveal-floor, new-tab and image-asset
      # check silently sat out CI and only ever ran on someone's laptop. The skip
      # was labeled, not silent, but nothing failed when it fired.
      - run: npm run build
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
