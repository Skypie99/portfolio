<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>Pac-Man Code Trainer — retro arcade flashcard game hero illustration</title>
  <defs>
    <!-- Scanline texture -->
    <pattern id="pm-scanlines" x="0" y="0" width="2" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#000000" opacity="0.06"/>
    </pattern>
    <!-- Pixel grid -->
    <pattern id="pm-grid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="16" height="16" fill="none" stroke="#B35F32" stroke-width="0.3" opacity="0.12"/>
    </pattern>
    <!-- Terminal glow -->
    <radialGradient id="pm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B35F32" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#232420" stop-opacity="0"/>
    </radialGradient>
    <!-- Text glow filter -->
    <filter id="pm-text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Amber glow for pacman -->
    <radialGradient id="pm-pacman-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2976E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#232420" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark background -->
  <rect width="800" height="500" fill="#232420"/>

  <!-- Pixel grid overlay -->
  <rect width="800" height="500" fill="url(#pm-grid)"/>

  <!-- Scanline overlay -->
  <rect width="800" height="500" fill="url(#pm-scanlines)"/>

  <!-- Ambient glow center -->
  <rect x="150" y="80" width="500" height="340" fill="url(#pm-glow)" rx="4"/>

  <!-- ───── Terminal window ───── -->
  <!-- Window frame -->
  <rect x="140" y="70" width="520" height="360" rx="6" fill="#1A1A17" stroke="#B35F32" stroke-width="1.5" opacity="0.9"/>

  <!-- Title bar -->
  <rect x="140" y="70" width="520" height="32" rx="6" fill="#2E2C28"/>
  <rect x="140" y="86" width="520" height="16" fill="#2E2C28"/>

  <!-- Traffic light dots -->
  <circle cx="168" cy="86" r="5" fill="#7F4323" opacity="0.8"/>
  <circle cx="186" cy="86" r="5" fill="#7F4323" opacity="0.5"/>
  <circle cx="204" cy="86" r="5" fill="#7F4323" opacity="0.3"/>

  <!-- Window title -->
  <text x="400" y="91" font-family="'Courier New', Courier, monospace" font-size="11" fill="#FBCFAC" text-anchor="middle" opacity="0.7" letter-spacing="2">PAC-MAN CODE TRAINER</text>

  <!-- Divider line -->
  <line x1="140" y1="102" x2="660" y2="102" stroke="#B35F32" stroke-width="0.8" opacity="0.3"/>

  <!-- Terminal content area -->
  <!-- Prompt line 1 -->
  <text x="168" y="132" font-family="'Courier New', Courier, monospace" font-size="13" fill="#B35F32" opacity="0.9" filter="url(#pm-text-glow)">$</text>
  <text x="183" y="132" font-family="'Courier New', Courier, monospace" font-size="13" fill="#FBCFAC" opacity="0.8"> claude --help</text>

  <!-- Command output 1 -->
  <text x="168" y="153" font-family="'Courier New', Courier, monospace" font-size="11" fill="#E2976E" opacity="0.7">  /compact     Compress context window</text>
  <text x="168" y="170" font-family="'Courier New', Courier, monospace" font-size="11" fill="#E2976E" opacity="0.7">  /review      Review all changes</text>
  <text x="168" y="187" font-family="'Courier New', Courier, monospace" font-size="11" fill="#E2976E" opacity="0.7">  /clear        Clear context</text>

  <!-- Divider -->
  <line x1="168" y1="200" x2="630" y2="200" stroke="#B35F32" stroke-width="0.5" opacity="0.2"/>

  <!-- Card flip area header -->
  <text x="168" y="222" font-family="'Courier New', Courier, monospace" font-size="11" fill="#7F4323" opacity="0.9">━━ FLASHCARD 12 / 40 ━━━━━━━━━━━━━━━━━━━━━━━━━</text>

  <!-- Flashcard visual -->
  <rect x="168" y="232" width="424" height="100" rx="3" fill="#2A2825" stroke="#B35F32" stroke-width="1" opacity="0.9"/>

  <!-- Card question text -->
  <text x="380" y="262" font-family="'Courier New', Courier, monospace" font-size="12" fill="#FBCFAC" text-anchor="middle" opacity="0.9">What command reviews all changes?</text>

  <!-- Flip instruction -->
  <text x="380" y="284" font-family="'Courier New', Courier, monospace" font-size="10" fill="#7F4323" text-anchor="middle" opacity="0.7">[SPACE] to flip card</text>

  <!-- Answer revealed -->
  <rect x="220" y="295" width="320" height="28" rx="3" fill="#B35F32" opacity="0.15"/>
  <text x="380" y="314" font-family="'Courier New', Courier, monospace" font-size="13" fill="#E2976E" text-anchor="middle" opacity="0.95" font-weight="bold">/review</text>

  <!-- Score bar -->
  <text x="168" y="358" font-family="'Courier New', Courier, monospace" font-size="10" fill="#7F4323" opacity="0.8">SCORE ▓▓▓▓▓▓▓▓░░░░ 8 / 12   STREAK: 🔥 5</text>

  <!-- Prompt line with cursor -->
  <text x="168" y="393" font-family="'Courier New', Courier, monospace" font-size="13" fill="#B35F32" opacity="0.9">$</text>
  <text x="183" y="393" font-family="'Courier New', Courier, monospace" font-size="13" fill="#FBCFAC" opacity="0.6"> _</text>
  <!-- Blinking cursor block -->
  <rect x="192" y="380" width="8" height="14" fill="#B35F32" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- ───── Pac-Man character (pixel art, bottom-right area) ───── -->
  <g transform="translate(580, 390)">
    <!-- Glow -->
    <circle cx="30" cy="20" r="40" fill="url(#pm-pacman-glow)"/>
    <!-- Body (yellow/amber) -->
    <path d="M30 20 L62 4 A32 32 0 1 0 62 36 Z" fill="#E2976E"/>
    <!-- Eye -->
    <circle cx="40" cy="10" r="3" fill="#232420"/>
    <!-- Dots being eaten -->
    <circle cx="72" cy="20" r="3" fill="#FBCFAC" opacity="0.8"/>
    <circle cx="84" cy="20" r="3" fill="#FBCFAC" opacity="0.6"/>
    <circle cx="96" cy="20" r="3" fill="#FBCFAC" opacity="0.4"/>
  </g>

  <!-- Pixel decorative elements — corners -->
  <!-- Top-left pixel cluster -->
  <rect x="30" y="30" width="6" height="6" fill="#B35F32" opacity="0.3"/>
  <rect x="40" y="30" width="6" height="6" fill="#B35F32" opacity="0.2"/>
  <rect x="30" y="40" width="6" height="6" fill="#B35F32" opacity="0.15"/>

  <!-- Bottom-left pixel cluster -->
  <rect x="30" y="460" width="6" height="6" fill="#B35F32" opacity="0.3"/>
  <rect x="40" y="460" width="6" height="6" fill="#B35F32" opacity="0.2"/>
  <rect x="30" y="450" width="6" height="6" fill="#B35F32" opacity="0.15"/>

  <!-- Top-right corner -->
  <rect x="764" y="30" width="6" height="6" fill="#E2976E" opacity="0.3"/>
  <rect x="754" y="30" width="6" height="6" fill="#E2976E" opacity="0.2"/>
  <rect x="764" y="40" width="6" height="6" fill="#E2976E" opacity="0.15"/>
</svg>
