<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>Mutual Mesh — community mutual-aid network hero illustration</title>
  <defs>
    <!-- Dot texture -->
    <pattern id="mm-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.9" fill="#7F4323" opacity="0.06"/>
    </pattern>
    <!-- Glow for center node -->
    <radialGradient id="mm-center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBCFAC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FAF9F5" stop-opacity="0"/>
    </radialGradient>
    <!-- Node shadow -->
    <filter id="mm-node-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#7F4323" flood-opacity="0.15"/>
    </filter>
    <!-- Soft connector blur -->
    <filter id="mm-line-blur">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#FAF9F5"/>

  <!-- Dot texture -->
  <rect width="800" height="500" fill="url(#mm-dots)"/>

  <!-- ───── Connector lines (drawn first, sit behind nodes) ───── -->
  <!-- Center to node connections — organic curves -->
  <!-- Center (400,250) to N1 (230,140) -->
  <path d="M400 250 Q310 180 230 140" stroke="#DCDCD6" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Center to N2 (570,130) -->
  <path d="M400 250 Q500 170 570 130" stroke="#DCDCD6" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Center to N3 (640,280) -->
  <path d="M400 250 Q540 250 640 280" stroke="#DCDCD6" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Center to N4 (530,380) -->
  <path d="M400 250 Q470 320 530 380" stroke="#DCDCD6" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Center to N5 (270,390) -->
  <path d="M400 250 Q330 330 270 390" stroke="#DCDCD6" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Center to N6 (150,290) -->
  <path d="M400 250 Q260 275 150 290" stroke="#DCDCD6" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Center to N7 (180,180) -->
  <path d="M400 250 Q270 205 180 180" stroke="#DCDCD6" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Peripheral node cross-connections -->
  <path d="M230 140 Q400 80 570 130" stroke="#DCDCD6" stroke-width="1" fill="none" opacity="0.35"/>
  <path d="M570 130 Q615 200 640 280" stroke="#DCDCD6" stroke-width="1" fill="none" opacity="0.35"/>
  <path d="M640 280 Q590 335 530 380" stroke="#DCDCD6" stroke-width="1" fill="none" opacity="0.35"/>
  <path d="M270 390 Q400 430 530 380" stroke="#DCDCD6" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M150 290 Q200 340 270 390" stroke="#DCDCD6" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M150 290 Q165 230 180 180" stroke="#DCDCD6" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M180 180 Q205 160 230 140" stroke="#DCDCD6" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Tertiery tiny satellite nodes + their connectors -->
  <line x1="230" y1="140" x2="190" y2="90" stroke="#DCDCD6" stroke-width="0.8" opacity="0.3"/>
  <line x1="570" y1="130" x2="620" y2="80" stroke="#DCDCD6" stroke-width="0.8" opacity="0.3"/>
  <line x1="640" y1="280" x2="710" y2="310" stroke="#DCDCD6" stroke-width="0.8" opacity="0.3"/>
  <line x1="270" y1="390" x2="240" y2="450" stroke="#DCDCD6" stroke-width="0.8" opacity="0.3"/>

  <!-- ───── Center node glow ───── -->
  <circle cx="400" cy="250" r="70" fill="url(#mm-center-glow)"/>

  <!-- ───── Center node ───── -->
  <circle cx="400" cy="250" r="34" fill="#B35F32" filter="url(#mm-node-shadow)"/>
  <circle cx="400" cy="250" r="26" fill="#B35F32"/>
  <!-- Center icon: two overlapping hands / heart silhouette -->
  <path d="M392 244 C392 239 396 236 400 239 C404 236 408 239 408 244 C408 250 400 258 400 258 C400 258 392 250 392 244 Z" fill="#FAF9F5"/>
  <!-- Outer ring on center node -->
  <circle cx="400" cy="250" r="34" fill="none" stroke="#FBCFAC" stroke-width="1.5" opacity="0.6"/>

  <!-- ───── Primary satellite nodes ───── -->
  <!-- N1 top-left -->
  <circle cx="230" cy="140" r="22" fill="#7F4323" filter="url(#mm-node-shadow)"/>
  <circle cx="230" cy="140" r="16" fill="#7F4323"/>
  <circle cx="230" cy="140" r="6" fill="#FBCFAC"/>

  <!-- N2 top-right -->
  <circle cx="570" cy="130" r="22" fill="#7F4323" filter="url(#mm-node-shadow)"/>
  <circle cx="570" cy="130" r="16" fill="#7F4323"/>
  <circle cx="570" cy="130" r="6" fill="#FBCFAC"/>

  <!-- N3 right -->
  <circle cx="640" cy="280" r="18" fill="#FBCFAC" filter="url(#mm-node-shadow)"/>
  <circle cx="640" cy="280" r="12" fill="#FBCFAC"/>
  <circle cx="640" cy="280" r="5" fill="#B35F32"/>

  <!-- N4 bottom-right -->
  <circle cx="530" cy="380" r="20" fill="#E2976E" filter="url(#mm-node-shadow)"/>
  <circle cx="530" cy="380" r="14" fill="#E2976E"/>
  <circle cx="530" cy="380" r="5" fill="#FAF9F5"/>

  <!-- N5 bottom-left -->
  <circle cx="270" cy="390" r="20" fill="#E2976E" filter="url(#mm-node-shadow)"/>
  <circle cx="270" cy="390" r="14" fill="#E2976E"/>
  <circle cx="270" cy="390" r="5" fill="#FAF9F5"/>

  <!-- N6 left -->
  <circle cx="150" cy="290" r="18" fill="#FBCFAC" filter="url(#mm-node-shadow)"/>
  <circle cx="150" cy="290" r="12" fill="#FBCFAC"/>
  <circle cx="150" cy="290" r="5" fill="#B35F32"/>

  <!-- N7 upper-left secondary -->
  <circle cx="180" cy="180" r="13" fill="#F0F0EA" filter="url(#mm-node-shadow)"/>
  <circle cx="180" cy="180" r="9" fill="#F0F0EA"/>
  <circle cx="180" cy="180" r="3.5" fill="#7F4323"/>

  <!-- ───── Tertiary tiny nodes ───── -->
  <circle cx="190" cy="90" r="7" fill="#DCDCD6"/>
  <circle cx="190" cy="90" r="3" fill="#B35F32"/>

  <circle cx="620" cy="80" r="7" fill="#DCDCD6"/>
  <circle cx="620" cy="80" r="3" fill="#B35F32"/>

  <circle cx="710" cy="310" r="7" fill="#DCDCD6"/>
  <circle cx="710" cy="310" r="3" fill="#E2976E"/>

  <circle cx="240" cy="450" r="7" fill="#DCDCD6"/>
  <circle cx="240" cy="450" r="3" fill="#E2976E"/>

  <!-- Word mark -->
  <text x="400" y="478" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" letter-spacing="4" fill="#7F4323" text-anchor="middle" opacity="0.5">MUTUAL MESH</text>
</svg>
