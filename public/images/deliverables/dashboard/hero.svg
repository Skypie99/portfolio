<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Dark dashboard motif with a blueprint grid, a soft blue glow, and the Claude Corp lightning mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="8%" r="70%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity="0.6"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- abstract dashboard cards -->
  <g opacity="0.9">
    <rect x="120" y="150" width="220" height="120" rx="14" fill="#111c30" stroke="#1e293b"/>
    <rect x="360" y="150" width="220" height="120" rx="14" fill="#111c30" stroke="#1e293b"/>
    <rect x="600" y="150" width="220" height="120" rx="14" fill="#111c30" stroke="#1e293b"/>
    <rect x="840" y="150" width="240" height="120" rx="14" fill="#111c30" stroke="#1e293b"/>
    <!-- accent values -->
    <rect x="140" y="205" width="46" height="30" rx="6" fill="#10b981" opacity="0.85"/>
    <rect x="380" y="205" width="46" height="30" rx="6" fill="#f59e0b" opacity="0.85"/>
    <rect x="620" y="205" width="46" height="30" rx="6" fill="#ef4444" opacity="0.85"/>
    <rect x="860" y="205" width="46" height="30" rx="6" fill="#3b82f6" opacity="0.85"/>
    <!-- label ticks -->
    <rect x="140" y="175" width="120" height="10" rx="5" fill="#334155"/>
    <rect x="380" y="175" width="120" height="10" rx="5" fill="#334155"/>
    <rect x="620" y="175" width="120" height="10" rx="5" fill="#334155"/>
    <rect x="860" y="175" width="120" height="10" rx="5" fill="#334155"/>
    <!-- lower panels -->
    <rect x="120" y="320" width="460" height="280" rx="16" fill="#0e1828" stroke="#1e293b"/>
    <rect x="600" y="320" width="480" height="280" rx="16" fill="#0e1828" stroke="#1e293b"/>
    <g fill="#1f3350">
      <rect x="150" y="360" width="400" height="14" rx="7"/>
      <rect x="150" y="394" width="360" height="14" rx="7"/>
      <rect x="150" y="428" width="380" height="14" rx="7"/>
      <rect x="150" y="462" width="320" height="14" rx="7"/>
      <rect x="630" y="360" width="420" height="14" rx="7"/>
      <rect x="630" y="394" width="380" height="14" rx="7"/>
      <rect x="630" y="428" width="400" height="14" rx="7"/>
    </g>
  </g>

  <!-- Claude Corp lightning mark -->
  <g transform="translate(600 95)">
    <circle r="34" fill="#2563eb"/>
    <path d="M4 -16 L-10 4 H0 L-4 16 L10 -4 H0 Z" fill="#ffffff" transform="scale(1.1)"/>
  </g>
</svg>
