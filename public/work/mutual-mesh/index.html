<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      REDIRECT STUB — /work/mutual-mesh/ → /work/

      Mutual Mesh was withdrawn from the portfolio on 2026-08-18. Its backend was
      taken down, and it will return later as part of a different project rather
      than being maintained in place.

      This file exists because the URL was real, was live, and was in the sitemap.
      A withdrawn project is not a reason to hand an inbound link a dead end, so
      it lands on the work index instead. Same mechanism and the same honest
      ceiling as the rename stubs beside it: a meta refresh, not a 301, because
      GitHub Pages serves static files and `redirects()` is inert under
      `output: 'export'`.

      No Open Graph identity on purpose — a signpost is not a page.

      When the successor project ships, delete this file and give the new work its
      own slug; do not resurrect this path.
    -->
    <meta http-equiv="refresh" content="0; url=/work/" />
    <link rel="canonical" href="https://skypistudio.com/work/" />

    <title>Moved to /work/ — Sky Halisky</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: #faf6f1;
        color: #2b2320;
        font: 1rem/1.7 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 34rem; }
      a { color: #a4552b; }
      @media (prefers-color-scheme: dark) {
        body { background: #17130f; color: #ece3d9; }
        a { color: #e0a173; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This case study has been withdrawn</h1>
      <p>
        Mutual Mesh is no longer listed here — it is being rebuilt as part of
        newer work. If you are not redirected automatically,
        <a href="/work/">see the rest of the work</a>.
      </p>
    </main>
  </body>
</html>
